<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 588" width="1120" height="588" role="img" aria-label="Five steps. You name the tool and pick one of warden's four adapters with kind = sql; you give the binding that reaches your own system, with ${VAR} read from the environment so no credential is in the file; you declare the arguments the agent may pass, which warden shape-checks on every call. Then warden's adapter describes what the call would touch, running a COUNT first so the agent cannot understate the ask, and executes it only if policy allowed, from the same arguments that were judged."><title>One tool, from your config to your database</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8B85A6"/></marker></defs><rect x="0.0" y="6.0" width="532.3" height="24.5" rx="12.2" fill="#EDEAF4" stroke="#B9B2CC" stroke-width="0.8"/><text x="266.1" y="18.2" fill="#2A2440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central">one tool, from the three lines you write to the query that runs</text><rect x="74" y="62" width="1020" height="84" rx="8" fill="#E7EBED" stroke="#37474F"/><text x="92" y="86" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">YOU name the tool and pick an adapter</text><text x="92" y="109" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">kind = "sql"   ·   warden ships docstore, sql, http and mail</text><text x="92" y="130" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">One line decides which of the four does the work. You never write an adapter.</text><circle cx="52" cy="104.0" r="19" fill="#37474F" stroke="#263238"/><text x="52" y="104.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text><path d="M52,148 L52,162" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="166" width="1020" height="84" rx="8" fill="#E7EBED" stroke="#37474F"/><text x="92" y="190" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">YOU say how to reach your own system</text><text x="92" y="213" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">[binding]   db, table, columns, subject_column, data_class</text><text x="92" y="234" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">${VAR} is read from the environment at load time, so no credential sits in the file</text><circle cx="52" cy="208.0" r="19" fill="#37474F" stroke="#263238"/><text x="52" y="208.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text><path d="M52,252 L52,266" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="270" width="1020" height="84" rx="8" fill="#E7EBED" stroke="#37474F"/><text x="92" y="294" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">YOU declare what the agent is allowed to pass</text><text x="92" y="317" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">[args]   filter = { type = "string", required = true }</text><text x="92" y="338" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">warden shape-checks every call against this before any of your code sees it</text><circle cx="52" cy="312.0" r="19" fill="#37474F" stroke="#263238"/><text x="52" y="312.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text><path d="M52,356 L52,370" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="374" width="1020" height="84" rx="8" fill="#F4F1FD" stroke="#7760DB"/><text x="92" y="398" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">WARDEN works out what the call would touch</text><text x="92" y="421" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">describe(args)  →  kind=db · subjects=customer:8812 · rows=1</text><text x="92" y="442" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">It runs a COUNT first, so the agent cannot understate how much it is asking for</text><circle cx="52" cy="416.0" r="19" fill="#7760DB" stroke="#5D41D4"/><text x="52" y="416.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text><path d="M52,460 L52,474" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="478" width="1020" height="84" rx="8" fill="#F4F1FD" stroke="#7760DB"/><text x="92" y="502" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">WARDEN performs it, only if policy allowed</text><text x="92" y="525" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">execute(args)  →  the SELECT against your database</text><text x="92" y="546" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">Both halves read the same arguments, so what was judged and what ran cannot differ</text><circle cx="52" cy="520.0" r="19" fill="#7760DB" stroke="#5D41D4"/><text x="52" y="520.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text></svg>
