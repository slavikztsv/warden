<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 326" width="1000" height="326" role="img" aria-label="warden sits between an AI agent and everything it can reach"><title>warden sits between an AI agent and everything it can reach</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8B85A6"/></marker><marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#B23A34"/></marker></defs><rect x="24.0" y="74.0" width="282.0" height="116.0" rx="7" fill="#FBEAE8" stroke="#B23A34"/><rect x="414.0" y="56.0" width="242.0" height="152.0" rx="7" fill="#EEE9FC" stroke="#6D4FD6"/><rect x="714.0" y="56.0" width="262.0" height="172.0" rx="7" fill="#E3F2EB" stroke="#2E7D5B"/><path d="M290.0,146.0 L430.0,146.0" fill="none" stroke="#8B85A6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="301.5" y="137.0" width="117.0" height="18" rx="9" fill="#EEE9FC" stroke="#6D4FD6" stroke-width="0.8"/><text x="360.0" y="146.0" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="central">every tool call</text><path d="M640.0,146.0 L685,146.0 L685,122.0 L730.0,122.0" fill="none" stroke="#8B85A6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M640.0,146.0 L685,146.0 L685,190.0 L730.0,190.0" fill="none" stroke="#8B85A6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M165.0,174.0 L165.0,268 L845.0,268 L845.0,212.0" fill="none" stroke="#B23A34" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowbad)"/><rect x="449.8" y="259.0" width="110.4" height="18" rx="9" fill="#FBEAE8" stroke="#B23A34" stroke-width="0.8"/><text x="505.0" y="268.0" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="central">no other route</text><rect x="40.0" y="118.0" width="250.0" height="56.0" rx="28.0" fill="#B23A34" stroke="#8B2A25"/><text x="165.0" y="139.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">AI agent</text><text x="165.0" y="153.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">reads text it cannot trust</text><polygon points="442.0,100.0 628.0,100.0 640.0,146.0 628.0,192.0 442.0,192.0 430.0,146.0" fill="#4527A0" stroke="#341E7A"/><text x="535.0" y="132.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">warden</text><text x="535.0" y="146.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">decide, record, then act</text><text x="535.0" y="160.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">every call, every task</text><rect x="730.0" y="100.0" width="230.0" height="44.0" rx="5" fill="#2E7D5B" stroke="#226046"/><text x="845.0" y="122.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Customer data · mail</text><rect x="730.0" y="168.0" width="230.0" height="44.0" rx="5" fill="#2E7D5B" stroke="#226046"/><text x="845.0" y="190.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">The internet</text><rect x="31.0" y="79.0" width="86.2" height="19" rx="4" fill="#FBEAE8"/><text x="37.0" y="91.0" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">UNTRUSTED</text><rect x="421.0" y="61.0" width="172.0" height="19" rx="4" fill="#EEE9FC"/><text x="427.0" y="73.0" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">THE ONLY WAY THROUGH</text><rect x="721.0" y="61.0" width="109.6" height="19" rx="4" fill="#E3F2EB"/><text x="727.0" y="73.0" fill="#1D4E39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">YOUR SYSTEMS</text><text x="500" y="300" fill="#B23A34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">the agent holds no credential for anything on the right, and no way round</text></svg>
