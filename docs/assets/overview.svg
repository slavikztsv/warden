lar, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">attacker.example</text><rect x="31.0" y="57.0" width="218.8" height="19" rx="4" fill="#FBEAE8"/><text x="37.0" y="69.0" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">WHAT AN ATTACKER CAN REACH</text><rect x="501.0" y="147.0" width="172.0" height="19" rx="4" fill="#EEE9FC"/><text x="507.0" y="159.0" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">THE ONLY WAY THROUGH</text><rect x="841.0" y="147.0" width="109.6" height="19" rx="4" fill="#E3F2EB"/><text x="847.0" y="159.0" fill="#1D4E39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">YOUR SYSTEMS</text><text x="610" y="472" fill="#B23A34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">the agent holds no credential for anything on the right, and no second route</text></svg>
