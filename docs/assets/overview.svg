<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1172.0 330" width="1172.0" height="330" role="img" aria-label="warden sits between an AI agent and everything it can reach"><title>warden sits between an AI agent and everything it can reach</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8B85A6"/></marker><marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#B23A34"/></marker></defs><rect x="24.0" y="66.0" width="282.0" height="136.0" rx="7" fill="#FBEAE8" stroke="#B23A34"/><rect x="550.0" y="52.0" width="282.0" height="164.0" rx="7" fill="#EEE9FC" stroke="#6D4FD6"/><rect x="890.0" y="52.0" width="262.0" height="172.0" rx="7" fill="#E3F2EB" stroke="#2E7D5B"/><path d="M290.0,131.28 L428.0,131.28 L428.0,148.0 L566.0,148.0" fill="none" stroke="#8B85A6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="317.0" y="122.3" width="84.0" height="18" rx="9" fill="#EEE9FC" stroke="#6D4FD6" stroke-width="0.8"/><text x="359.0" y="131.3" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="central">tool calls</text><path d="M290.0,164.72 L428.0,164.72 L428.0,148.0 L566.0,148.0" fill="none" stroke="#8B85A6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="312.1" y="155.7" width="110.4" height="18" rx="9" fill="#EEE9FC" stroke="#6D4FD6" stroke-width="0.8"/><text x="367.3" y="164.7" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="central">all other HTTP</text><path d="M816.0,148.0 L861,148.0 L861,118.0 L906.0,118.0" fill="none" stroke="#8B85A6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M816.0,148.0 L861,148.0 L861,186.0 L906.0,186.0" fill="none" stroke="#8B85A6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M165.0,186.0 L165.0,272 L1021.0,272 L1021.0,208.0" fill="none" stroke="#B23A34" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowbad)"/><rect x="537.8" y="263.0" width="110.4" height="18" rx="9" fill="#FBEAE8" stroke="#B23A34" stroke-width="0.8"/><text x="593.0" y="272.0" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="central">no other route</text><rect x="40.0" y="110.0" width="250.0" height="76.0" rx="38.0" fill="#B23A34" stroke="#8B2A25"/><text x="165.0" y="141.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">AI agent</text><text x="165.0" y="155.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">reads text it cannot trust</text><polygon points="578.0,96.0 804.0,96.0 816.0,148.0 804.0,200.0 578.0,200.0 566.0,148.0" fill="#4527A0" stroke="#341E7A"/><text x="691.0" y="134.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">warden</text><text x="691.0" y="148.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">tool API :8080 · proxy :3128</text><text x="691.0" y="162.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">decide, record, then act</text><rect x="906.0" y="96.0" width="230.0" height="44.0" rx="5" fill="#2E7D5B" stroke="#226046"/><text x="1021.0" y="118.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Customer data · mail</text><rect x="906.0" y="164.0" width="230.0" height="44.0" rx="5" fill="#2E7D5B" stroke="#226046"/><text x="1021.0" y="186.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">The internet</text><rect x="31.0" y="71.0" width="86.2" height="19" rx="4" fill="#FBEAE8"/><text x="37.0" y="83.0" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">UNTRUSTED</text><rect x="557.0" y="57.0" width="172.0" height="19" rx="4" fill="#EEE9FC"/><text x="563.0" y="69.0" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">THE ONLY WAY THROUGH</text><rect x="897.0" y="57.0" width="109.6" height="19" rx="4" fill="#E3F2EB"/><text x="903.0" y="69.0" fill="#1D4E39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">YOUR SYSTEMS</text><text x="600" y="304" fill="#B23A34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">the agent holds no credential for anything on the right, and no way round</text></svg>
