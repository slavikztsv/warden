<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 1140 900" width="1140" height="900" role="img" aria-label="Eight steps from demo/scenario/task.toml to the audit log, naming the file responsible for each"><title>Who starts a task in the demo</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8B85A6"/></marker></defs><rect x="0.0" y="6.0" width="427.0" height="24.5" rx="12.2" fill="#EDEAF4" stroke="#B9B2CC" stroke-width="0.8"/><text x="213.5" y="18.2" fill="#2A2440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central">who starts a task in the demo, and from which file</text><rect x="74" y="62" width="1020" height="84" rx="8" fill="#FAF1DF" stroke="#976D19"/><text x="92" y="86" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">demo/scenario/task.toml</text><text x="92" y="109" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Declares the task: purpose, allowed tools, counterparties, the prompt</text><text x="92" y="130" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">The authority is decided here, in config, before a line of code runs</text><circle cx="52" cy="104.0" r="19" fill="#976D19" stroke="#795714"/><text x="52" y="104.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text><path d="M52,148 L52,162" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="166" width="1020" height="84" rx="8" fill="#FAF1DF" stroke="#976D19"/><text x="92" y="190" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">demo/cli/main.py  _generate_keypair()</text><text x="92" y="213" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Generates the Ed25519 keypair OUTSIDE every container, then starts OPA, broker, broker-control</text><text x="92" y="234" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">The broker gets the public half only, so it can verify but never mint</text><circle cx="52" cy="208.0" r="19" fill="#976D19" stroke="#795714"/><text x="52" y="208.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text><path d="M52,252 L52,266" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="270" width="1020" height="84" rx="8" fill="#FAF1DF" stroke="#976D19"/><text x="92" y="294" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">demo/cli/main.py  _mint_token()</text><text x="92" y="317" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">POSTs that [task] table to broker-control on :8081</text><text x="92" y="338" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">The orchestrator asks for authority; the agent never does, and has no route to</text><circle cx="52" cy="312.0" r="19" fill="#976D19" stroke="#795714"/><text x="52" y="312.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text><path d="M52,356 L52,370" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="374" width="1020" height="84" rx="8" fill="#EEE9FC" stroke="#6D4FD6"/><text x="92" y="398" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">warden/broker/control.py</text><text x="92" y="421" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Signs one task token, five-minute TTL, scoped to exactly what was asked for</text><text x="92" y="442" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">The only process holding the private key, reachable only from backend-net</text><circle cx="52" cy="416.0" r="19" fill="#6D4FD6" stroke="#5340AE"/><text x="52" y="416.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text><path d="M52,460 L52,474" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="478" width="1020" height="84" rx="8" fill="#FBEAE8" stroke="#B23A34"/><text x="92" y="502" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">demo/agent/loop.py  main()</text><text x="92" y="525" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Runs with TASK_TOKEN, BROKER_URL and HTTP_PROXY set; asks the model, proposes tool calls</text><text x="92" y="546" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">Untrusted by design: it reads documents an attacker can influence</text><circle cx="52" cy="520.0" r="19" fill="#B23A34" stroke="#8B2A25"/><text x="52" y="520.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text><path d="M52,564 L52,578" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="582" width="1020" height="84" rx="8" fill="#EEE9FC" stroke="#6D4FD6"/><text x="92" y="606" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">warden/broker/spine.py  handle_tool_call()</text><text x="92" y="629" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">verify → validate → describe → charge → decide → record → execute</text><text x="92" y="650" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">Every call judged against the token AND everything the task has done so far</text><circle cx="52" cy="624.0" r="19" fill="#6D4FD6" stroke="#5340AE"/><text x="52" y="624.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text><path d="M52,668 L52,682" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="686" width="1020" height="84" rx="8" fill="#E9E4F8" stroke="#4527A0"/><text x="92" y="710" fill="#2A1968" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">warden/policies/authz.rego</text><text x="92" y="733" fill="#2A1968" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Answers allow, or deny_reasons naming the rule that objected</text><text x="92" y="754" fill="#2A1968" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">The deployment's rules, evaluated outside the process being governed</text><circle cx="52" cy="728.0" r="19" fill="#4527A0" stroke="#341E7A"/><text x="52" y="728.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">7</text><path d="M52,772 L52,786" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="790" width="1020" height="84" rx="8" fill="#E7EBED" stroke="#37474F"/><text x="92" y="814" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">data/audit.jsonl → warden replay 4711</text><text x="92" y="837" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Hash-chained record of every decision, written before the action</text><text x="92" y="858" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">What happened is provable afterwards, including the refusals</text><circle cx="52" cy="832.0" r="19" fill="#37474F" stroke="#263238"/><text x="52" y="832.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">8</text></svg>
