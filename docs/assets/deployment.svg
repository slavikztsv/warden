<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1066.0 584.0" width="1066.0" height="584.0" role="img" aria-label="what ships, what you write, what you run"><title>what ships, what you write, what you run</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8B85A6"/></marker><marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#B23A34"/></marker></defs><rect x="24.0" y="52.0" width="322.0" height="310.0" rx="7" fill="#EEE9FC" stroke="#6D4FD6"/><rect x="374.0" y="52.0" width="322.0" height="310.0" rx="7" fill="#FAF1DF" stroke="#976D19"/><rect x="724.0" y="52.0" width="322.0" height="310.0" rx="7" fill="#E3F2EB" stroke="#2E7D5B"/><rect x="40.0" y="96.0" width="290.0" height="62.0" rx="5" fill="#6D4FD6" stroke="#5340AE"/><text x="185.0" y="113.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">warden</text><text x="185.0" y="127.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">serve · control · replay</text><text x="185.0" y="141.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">verify-chain · config</text><rect x="40.0" y="190.0" width="290.0" height="62.0" rx="5" fill="#6D4FD6" stroke="#5340AE"/><text x="185.0" y="207.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">4 adapters + authz.rego</text><text x="185.0" y="221.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">docstore · sql · http · mail</text><text x="185.0" y="235.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">the seven rules</text><rect x="40.0" y="284.0" width="290.0" height="62.0" rx="5" fill="#6D4FD6" stroke="#5340AE"/><text x="185.0" y="308.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">NO config at all</text><text x="185.0" y="322.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">no tool, host or limit anywhere</text><rect x="390.0" y="96.0" width="290.0" height="62.0" rx="5" fill="#976D19" stroke="#795714"/><text x="535.0" y="120.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">one Ed25519 keypair</text><text x="535.0" y="134.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">openssl, run once</text><rect x="390.0" y="190.0" width="290.0" height="62.0" rx="5" fill="#976D19" stroke="#795714"/><text x="535.0" y="214.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">warden.toml · control.toml</text><text x="535.0" y="228.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">where things listen and live</text><rect x="390.0" y="284.0" width="290.0" height="62.0" rx="5" fill="#976D19" stroke="#795714"/><text x="535.0" y="301.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">tools.toml · data.json</text><text x="535.0" y="315.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">one block per tool</text><text x="535.0" y="329.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">your hosts and limits</text><rect x="740.0" y="96.0" width="290.0" height="62.0" rx="5" fill="#2E7D5B" stroke="#226046"/><text x="885.0" y="120.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">OPA</text><text x="885.0" y="134.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">evaluates the rules</text><rect x="740.0" y="190.0" width="290.0" height="62.0" rx="5" fill="#2E7D5B" stroke="#226046"/><text x="885.0" y="214.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">warden serve</text><text x="885.0" y="228.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">warden control</text><rect x="740.0" y="284.0" width="290.0" height="62.0" rx="5" fill="#2E7D5B" stroke="#226046"/><text x="885.0" y="308.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">your agent, unchanged</text><text x="885.0" y="322.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">BROKER_URL + HTTP_PROXY</text><rect x="40.0" y="410.0" width="990.0" height="62.0" rx="5" fill="#7760DB" stroke="#5D41D4"/><text x="535.0" y="434.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Per tool you write three things</text><text x="535.0" y="448.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">kind = which adapter  ·  binding = how to reach your system  ·  args = what the agent may pass</text><rect x="40.0" y="502.0" width="990.0" height="62.0" rx="5" fill="#B23A34" stroke="#8B2A25"/><text x="535.0" y="526.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Not a document store, SQL database, HTTP API or mailer?</text><text x="535.0" y="540.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">that one needs Python inside warden, and is a stated limitation</text><rect x="31.0" y="57.0" width="257.8" height="19" rx="4" fill="#EEE9FC"/><text x="37.0" y="69.0" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">COMES WITH WARDEN · pip install</text><rect x="381.0" y="57.0" width="273.4" height="19" rx="4" fill="#FAF1DF"/><text x="387.0" y="69.0" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">YOU WRITE THESE · 4 files + 1 key</text><rect x="731.0" y="57.0" width="226.6" height="19" rx="4" fill="#E3F2EB"/><text x="737.0" y="69.0" fill="#1D4E39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">YOU RUN THESE · 3 processes</text></svg>
