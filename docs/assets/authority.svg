<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 1140 588" width="1140" height="588" role="img" aria-label="Five steps: you generate an Ed25519 keypair outside every container; warden's broker-control holds the private half and is the only thing that can sign a token; warden's broker holds the public half and can only verify; your orchestrator asks broker-control for a token naming the task, its purpose, its tools and its counterparties; the agent receives that one token and cannot mint another"><title>Where an agent's authority comes from</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8B85A6"/></marker></defs><rect x="0.0" y="6.0" width="516.1" height="24.5" rx="12.2" fill="#EDEAF4" stroke="#B9B2CC" stroke-width="0.8"/><text x="258.0" y="18.2" fill="#2A2440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central">where an agent's authority comes from, and who owns each step</text><rect x="74" y="62" width="1020" height="84" rx="8" fill="#E7EBED" stroke="#37474F"/><text x="92" y="86" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">YOU generate one Ed25519 keypair</text><text x="92" y="109" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">openssl genpkey -algorithm ed25519 · once, outside every container</text><text x="92" y="130" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">warden ships no key generation on purpose: the thing that enforces must never hold a signing key</text><circle cx="52" cy="104.0" r="19" fill="#37474F" stroke="#263238"/><text x="52" y="104.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text><path d="M52,148 L52,162" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="166" width="1020" height="84" rx="8" fill="#FAF1DF" stroke="#976D19"/><text x="92" y="190" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">WARDEN runs broker-control with the private half</text><text x="92" y="213" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">warden control --config control.toml · on a network the agent cannot reach</text><text x="92" y="234" fill="#6B4C0F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">Ships with warden, you do not write it. It is the only process that can sign a token.</text><circle cx="52" cy="208.0" r="19" fill="#976D19" stroke="#795714"/><text x="52" y="208.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text><path d="M52,252 L52,266" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="270" width="1020" height="84" rx="8" fill="#EEE9FC" stroke="#6D4FD6"/><text x="92" y="294" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">WARDEN runs the broker with the public half</text><text x="92" y="317" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">warden serve --config warden.toml</text><text x="92" y="338" fill="#3F2E8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">It can check a token and never issue one, so compromising it still mints nothing</text><circle cx="52" cy="312.0" r="19" fill="#6D4FD6" stroke="#5340AE"/><text x="52" y="312.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text><path d="M52,356 L52,370" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="374" width="1020" height="84" rx="8" fill="#E7EBED" stroke="#37474F"/><text x="92" y="398" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">YOUR orchestrator asks for a token, per task</text><text x="92" y="421" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">POST /v1/tokens · task_id, purpose, allowed_tools, counterparties</text><text x="92" y="442" fill="#1E282D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">Whatever starts the work: a helpdesk, a queue, a cron. Never the agent itself.</text><circle cx="52" cy="416.0" r="19" fill="#37474F" stroke="#263238"/><text x="52" y="416.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text><path d="M52,460 L52,474" fill="none" stroke="#8B85A6" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="478" width="1020" height="84" rx="8" fill="#FBEAE8" stroke="#B23A34"/><text x="92" y="502" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">The agent gets one token and spends it</text><text x="92" y="525" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Bearer on the tool API, Basic on the proxy · five minutes by default</text><text x="92" y="546" fill="#7A241F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.75">It cannot widen its own scope or reset its budget, because it cannot mint</text><circle cx="52" cy="520.0" r="19" fill="#B23A34" stroke="#8B2A25"/><text x="52" y="520.0" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text></svg>
