# The control plane's wiring: where it listens, and the private key it is the
# only process allowed to load. Mounted read-only into the `broker-control`
# service at /config/control.toml (see docker-compose.yml) and pointed to by
# WARDEN_CONTROL_CONFIG.
#
# Phase 3 moves this file under demo/scenario/.

[control]
listen = "0.0.0.0:8081"

[identity]
private_key = "/data/agent.key"
