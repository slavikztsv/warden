name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install OPA
        run: ./scripts/fetch-opa.sh
      - name: Install
        run: pip install -e ./warden -e ./demo && pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Policy unit tests
        run: '"$OPA_BIN" test warden/policies/ -v'
      - name: Config consistency
        env:
          DOCSTORE_URL: http://docstore.internal
          DB_PATH: data/customers.db
          MAILER_URL: http://mailer.internal
        run: python -m warden.cli.replay config --catalog demo/scenario/tools.toml --data warden/policies/data.json
      - name: Python tests
        run: pytest -v
