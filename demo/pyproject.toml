[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-demo"
version = "0.1.0"
description = "The support-ticket prompt-injection scenario warden is demonstrated with"
requires-python = ">=3.11"
# One-way. Nothing declares warden-demo, so pip enforces the seam the tests
# confirm: the product image installs ./warden and cannot pull demo code in.
dependencies = ["warden"]

[project.optional-dependencies]
# Only needed for `warden-demo explain --live` and `warden-demo sweep`.
# OpenRouter needs neither -- it speaks the OpenAI HTTP shape over httpx.
live = ["google-genai==2.15.0", "anthropic==0.69.0"]

[project.scripts]
warden-demo = "demo.cli.main:main"

# See warden/pyproject.toml for why this is an explicit list rather than
# packages.find with `where = [".."]`: that form (needed pre-Task-20, when
# demo/ held only demo/cli/ and demo/scenario/) puts the REPO ROOT on
# sys.path on an editable install, not just the demo package -- verified via
# `import broker` succeeding from a demo-only install before this fix.
[tool.setuptools]
packages = [
    "demo",
    "demo.agent",
    "demo.cli",
    "demo.mocks",
    "demo.scenario",
]

[tool.setuptools.package-dir]
demo = "."
