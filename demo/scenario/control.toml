# The control plane's wiring: where it listens, the private key it is the
# only process allowed to load, and the token issuer/TTL it mints under.
# Mounted read-only into the `broker-control` service at
# /config/control.toml (see compose.yml) and pointed to by
# WARDEN_CONTROL_CONFIG.
#
# [tokens].issuer must match warden.toml's [tokens].issuer exactly -- the
# broker verifies against its own configured issuer, and a mismatch fails
# every token, loudly. ttl_seconds is control-plane-only: the broker never
# mints, so it has no use for a TTL.
#
# [audit].path must match warden.toml's [audit].path exactly, and this one
# fails QUIETLY. The control plane records every mint into the same
# hash-chained log the broker writes decisions into -- that is what lets the
# log answer "what was task 4711 allowed to do" and not only "what did it
# try". compose.yml mounts ./data:/data into both services, so the directory
# is shared; the two paths are separate strings that nothing compares. Point
# them at different files and you get two chains, no error, and a mint that
# never appears above the first tool call.

[control]
listen = "0.0.0.0:8081"

[identity]
private_key = "/data/agent.key"

[audit]
# MUST equal warden.toml's [audit].path. See the note above.
path = "/data/audit.jsonl"
# "fsync" (the default) or "flush". Unlike `path` directly above, this one
# need NOT match warden.toml's -- see the longer note there. The control plane
# writes a handful of mint records per task, so it has no throughput reason to
# ever weaken.
durability = "fsync"
# Where a segment closes, in bytes; 64MiB (the default) is about 122,000
# records. This need not match warden.toml's either -- see the longer note there
# -- but it is set here because the control plane writes into the SAME chain, so
# whichever process crosses its own threshold is the one that rotates. Leaving
# it out would make segment sizes depend on which writer got there first.
segment_bytes = 67108864

[tokens]
issuer      = "warden-broker"
ttl_seconds = 300
