# The broker's wiring -- ports, paths, the PDP and its decision path, the
# token issuer, and the tool catalog. Mounted read-only into the `broker`
# service at /config/warden.toml (see compose.yml) and pointed to by
# WARDEN_CONFIG.
#
# DOCSTORE_URL, DB_PATH and MAILER_URL are deliberately NOT here: they
# interpolate ${VAR} bindings inside demo/scenario/tools.toml, not this file,
# and stay in the broker service's `environment:` in compose.yml.
#
# [tokens] has issuer only, not ttl_seconds: the broker VERIFIES a token's
# issuer (it must match control.toml's, or every token is rejected) but
# never MINTS one, so a TTL here would be parsed and never consumed.
# ttl_seconds lives in control.toml.

[broker]
listen       = "0.0.0.0:8080"
proxy_listen = "0.0.0.0:3128"
# How many tool calls and CONNECT authorizations may be in flight at once.
# One pool serves both surfaces. Left out entirely it defaults to 16; named
# here so the demo's config shows the knob rather than hiding it.
worker_threads = 16

[identity]
public_key = "/data/agent.pub"

[policy]
opa_url       = "http://opa:8181"
decision_path = "warden/authz"
bundle_roots  = ["/policies"]

[audit]
# MUST equal control.toml's [audit].path. Two processes write this one
# hash chain: the broker's decisions and the control plane's mint records.
# compose.yml shares the directory (./data:/data into both services); nothing
# compares the two path strings, so a divergence here is two chains and no
# error anywhere.
path = "/data/audit.jsonl"
# "fsync" (the default) or "flush". "fsync" means append() returns only once
# the record is on the disk, so it survives the host losing power -- measured
# at ~1.7ms against ~107us, flat in log size, which puts the whole
# deployment's audit ceiling at ~590 records/second because appends serialize
# under one lock. "flush" returns once the record is in the kernel's page
# cache: it survives this process dying, not the host.
#
# Unlike `path` above, this one need NOT match control.toml's. A broker at
# "flush" with a control plane at "fsync" says "the grant must survive power
# loss; the high-volume decisions accept the risk" -- a coherent tiering, not
# a misconfiguration, and nothing compares the two.
durability = "fsync"

[tokens]
issuer = "warden-broker"

[catalog]
tools = "/config/tools.toml"

# Optional, and both values below are the defaults -- written out rather than
# omitted because they are the two knobs that change what a row budget MEANS,
# and a knob nobody can find is a knob nobody sets.
#
# max_in_flight_seconds is the deadline on one call's reservation. A call is
# charged describe()'s row estimate before it runs, and that charge is
# collected if nothing settles it -- which is what stops a broker killed
# mid-call from leaking budget forever. It must exceed the slowest execute();
# 60 is six times the 10s timeout on the shared HTTP client every network
# adapter uses.
#
# ttl_grace_seconds is how long a task's whole state outlives the expiry of
# the last token that touched it. Task state deliberately survives token
# renewal -- renewing must not reset a budget -- so this is the only thing
# that can ever evict it. A task silent for longer than this starts clean.
[task_state]
max_in_flight_seconds = 60
ttl_grace_seconds     = 3600
