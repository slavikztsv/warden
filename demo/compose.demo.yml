# The demo overlay. Adds docstore, mailer, sinkhole, agent-runtime and
# agent-runtime-unprotected on top of compose.yml's opa/broker/broker-control
# and its four network definitions. Always run together with the base file:
#
#   docker compose -f compose.yml -f demo/compose.demo.yml --profile protected ...
#
# Every service here builds from demo/Dockerfile, which contains BOTH trees
# by necessity -- see that file's own comment -- unlike warden/Dockerfile,
# which builds opa's sibling services in compose.yml and contains no demo
# code at all.

services:
  # Adds to compose.yml's own `broker: depends_on: [opa]` -- Compose MERGES
  # depends_on across files by service key, it does not replace it, so this
  # does not need to repeat `opa` here. Named here rather than in the base
  # file because docstore and mailer are demo services that do not exist
  # when compose.yml runs alone (see compose.yml's own comment on this).
  broker:
    depends_on: [docstore, mailer]

  docstore:
    build:
      context: .
      dockerfile: demo/Dockerfile
    command: ["uvicorn", "demo.mocks.docstore:app", "--host", "0.0.0.0", "--port", "80"]
    networks:
      backend-net:
        aliases: [docstore.internal]
    profiles: [protected, unprotected]

  mailer:
    build:
      context: .
      dockerfile: demo/Dockerfile
    command: ["uvicorn", "demo.mocks.mailer:app", "--host", "0.0.0.0", "--port", "80"]
    networks:
      backend-net:
        aliases: [mailer.internal]
    profiles: [protected, unprotected]

  sinkhole:
    build:
      context: .
      dockerfile: demo/Dockerfile
    command: ["uvicorn", "demo.mocks.sinkhole:app", "--host", "0.0.0.0", "--port", "80"]
    networks:
      backend-net:
        aliases: [attacker.example]
      host-net: {}
    ports: ["8099:80"]     # host access so the demo can show what arrived
    profiles: [protected, unprotected]

  agent-runtime:
    build:
      context: .
      dockerfile: demo/Dockerfile
      args: { LIVE: "1" }
    command: ["sh", "-c", "exec python -m demo.agent.loop $$AGENT_ARGS"]
    environment:
      BROKER_URL: http://broker:8080
      TASK_TOKEN: ${TASK_TOKEN}
      TASK_ID: "4711"
      # Point every proxy-aware client at :3128 so an out-of-band attempt is
      # DENIED AND RECORDED rather than merely failing to route. Without this
      # the proxy never sees a CONNECT and is decoration — the isolation test
      # would show a bare connection failure and the replay would contain no
      # egress record at all.
      # The task token rides in the proxy URL as Basic credentials. A model
      # SDK owns its own HTTP client and will not set a Bearer header for us,
      # but every proxy-aware client sends Proxy-Authorization when the URL
      # carries userinfo. The username is ignored; the password is the token.
      HTTP_PROXY: http://agent:${TASK_TOKEN}@broker:3128
      HTTPS_PROXY: http://agent:${TASK_TOKEN}@broker:3128
      # Lowercase forms too: curl deliberately ignores uppercase HTTP_PROXY for
      # plain-http URLs (the httpoxy mitigation), so without these a plain-http
      # probe dies at DNS and never reaches the proxy — blocked, but unrecorded.
      http_proxy: http://agent:${TASK_TOKEN}@broker:3128
      https_proxy: http://agent:${TASK_TOKEN}@broker:3128
      # The broker's own tool API must NOT be proxied through the broker's own
      # proxy. httpx honours these variables by default (trust_env), so without
      # this exclusion every legitimate tool call would loop back through :3128.
      NO_PROXY: broker
      # Only the agent gets a model credential. The broker enforces policy and
      # has no business holding one.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WARDEN_PROVIDER: ${WARDEN_PROVIDER:-}
      AGENT_ARGS: ${AGENT_ARGS:-}
    networks: [agent-net]           # the ONLY network — no route anywhere else
    depends_on: [broker]
    profiles: [protected]

  agent-runtime-unprotected:
    build:
      context: .
      dockerfile: demo/Dockerfile
      args: { LIVE: "1" }
    command: ["python", "-m", "demo.agent.loop"]
    environment:
      DOCSTORE_URL: http://docstore.internal
      MAILER_URL: http://mailer.internal
      DB_PATH: /data/customers.db
      TASK_ID: "4711"
    volumes:
      - ./data:/data
    networks: [backend-net, egress-net]
    depends_on: [docstore, mailer, sinkhole]
    profiles: [unprotected]
