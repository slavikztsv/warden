name: warden

networks:
  agent-net:
    internal: true      # no gateway — this is the containment property
  backend-net:
    internal: true
  egress-net:
    driver: bridge
  # Docker silently ignores `ports:` on a container attached ONLY to internal
  # networks — no proxy is created and nothing listens on the host. Services
  # that must be reachable from the host therefore need a non-internal network
  # too. This does NOT weaken containment: agent-runtime is on agent-net alone
  # and is attached to none of these.
  host-net:
    driver: bridge

services:
  opa:
    image: openpolicyagent/opa:1.19.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    networks: [backend-net]
    profiles: [guarded]

  docstore:
    build: .
    command: ["uvicorn", "mocks.docstore:app", "--host", "0.0.0.0", "--port", "80"]
    networks:
      backend-net:
        aliases: [docstore.internal]
    profiles: [guarded, unprotected]

  mailer:
    build: .
    command: ["uvicorn", "mocks.mailer:app", "--host", "0.0.0.0", "--port", "80"]
    networks:
      backend-net:
        aliases: [mailer.internal]
    profiles: [guarded, unprotected]

  sinkhole:
    build: .
    command: ["uvicorn", "mocks.sinkhole:app", "--host", "0.0.0.0", "--port", "80"]
    networks:
      backend-net:
        aliases: [attacker.example]
      host-net: {}
    ports: ["8099:80"]     # host access so the demo can show what arrived
    profiles: [guarded, unprotected]

  # The enforcement point. Attached to agent-net by necessity — it is the only
  # host the agent can reach — and therefore the most exposed service here. It
  # loads /data/agent.pub and NOTHING ELSE: no signing key lives in this
  # container, so compromising it does not yield the ability to mint a token.
  broker:
    build: .
    command: ["python", "-m", "broker"]
    environment:
      OPA_URL: http://opa:8181
      DOCSTORE_URL: http://docstore.internal
      MAILER_URL: http://mailer.internal
      DB_PATH: /data/customers.db
      AUDIT_PATH: /data/audit.jsonl
      AGENT_PUBLIC_KEY_PATH: /data/agent.pub
    volumes:
      - ./data:/data
      - ./policies:/policies:ro
    networks: [agent-net, backend-net, egress-net]
    depends_on: [opa, docstore, mailer]
    profiles: [guarded]

  # The control plane: the only process holding the private key, and the only
  # one that can mint a token. Attached to backend-net ONLY — never agent-net.
  # That is the whole control: the endpoint has no caller authentication, so
  # the property "the agent cannot mint itself a token" rests on there being no
  # route from agent-net to this listener.
  #
  # `ports:` publishes to the HOST so the demo's orchestrator can request a
  # token. It does NOT restrict container-to-container reach, which is why
  # co-hosting this on the broker (attached to agent-net) was an escalation
  # path with a comment claiming otherwise. Same pattern as sinkhole above:
  # published from an internal network, reachable from the host, unreachable
  # from agent-net.
  broker-control:
    build: .
    command: ["python", "-m", "broker.control_main"]
    environment:
      AGENT_PRIVATE_KEY_PATH: /data/agent.key
    volumes:
      - ./data:/data
    networks: [backend-net, host-net]
    ports: ["8081:8081"]
    profiles: [guarded]

  agent-runtime:
    build:
      context: .
      args: { LIVE: "1" }
    command: ["sh", "-c", "exec python -m agent.loop $$AGENT_ARGS"]
    environment:
      BROKER_URL: http://broker:8080
      TASK_TOKEN: ${TASK_TOKEN}
      TASK_ID: "4711"
      # Point every proxy-aware client at :3128 so an out-of-band attempt is
      # DENIED AND RECORDED rather than merely failing to route. Without this
      # the proxy never sees a CONNECT and is decoration — the isolation test
      # would show a bare connection failure and the replay would contain no
      # egress record at all.
      # The task token rides in the proxy URL as Basic credentials. A model
      # SDK owns its own HTTP client and will not set a Bearer header for us,
      # but every proxy-aware client sends Proxy-Authorization when the URL
      # carries userinfo. The username is ignored; the password is the token.
      HTTP_PROXY: http://agent:${TASK_TOKEN}@broker:3128
      HTTPS_PROXY: http://agent:${TASK_TOKEN}@broker:3128
      # Lowercase forms too: curl deliberately ignores uppercase HTTP_PROXY for
      # plain-http URLs (the httpoxy mitigation), so without these a plain-http
      # probe dies at DNS and never reaches the proxy — blocked, but unrecorded.
      http_proxy: http://agent:${TASK_TOKEN}@broker:3128
      https_proxy: http://agent:${TASK_TOKEN}@broker:3128
      # The broker's own tool API must NOT be proxied through the broker's own
      # proxy. httpx honours these variables by default (trust_env), so without
      # this exclusion every legitimate tool call would loop back through :3128.
      NO_PROXY: broker
      # Only the agent gets a model credential. The broker enforces policy and
      # has no business holding one.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WARDEN_PROVIDER: ${WARDEN_PROVIDER:-}
      AGENT_ARGS: ${AGENT_ARGS:-}
    networks: [agent-net]           # the ONLY network — no route anywhere else
    depends_on: [broker]
    profiles: [guarded]

  agent-runtime-unprotected:
    build:
      context: .
      args: { LIVE: "1" }
    command: ["python", "-m", "agent.loop"]
    environment:
      DOCSTORE_URL: http://docstore.internal
      MAILER_URL: http://mailer.internal
      DB_PATH: /data/customers.db
      TASK_ID: "4711"
    volumes:
      - ./data:/data
    networks: [backend-net, egress-net]
    depends_on: [docstore, mailer, sinkhole]
    profiles: [unprotected]
