[pytest]
testpaths = tests
asyncio_mode = auto
# Pin the future default explicitly so CI logs stay clean; only affects async
# fixtures, and this suite has none that rely on a broader scope.
asyncio_default_fixture_loop_scope = function
# pythonpath = . is gone: broker/, cli/, agent/, mocks/ are reachable because
# `pip install -e ./warden -e ./demo` puts the repo root itself on sys.path
# (both editable installs resolve to a single-directory where=[".."] mapping
# and setuptools takes that as license to add the repo root wholesale --
# see warden/pyproject.toml). --import-mode=importlib is added for Task 21's
# split test trees, which will have colliding basenames across warden/tests
# and demo/tests that the default (prepend) import mode cannot disambiguate.
addopts = --import-mode=importlib
markers =
    integration: requires the opa binary on PATH
