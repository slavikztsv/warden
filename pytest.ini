[pytest]
testpaths = tests
asyncio_mode = auto
# Pin the future default explicitly so CI logs stay clean; only affects async
# fixtures, and this suite has none that rely on a broader scope.
asyncio_default_fixture_loop_scope = function
# pythonpath = . is gone: warden.broker.*, demo.agent.*, demo.mocks.* etc. are
# reachable because `pip install -e ./warden -e ./demo` registers a
# MAPPING-based editable finder for each ("warden" -> warden/, "demo" ->
# demo/ -- see warden/pyproject.toml and demo/pyproject.toml), NOT a
# repo-root .pth. That distinction is load-bearing, not cosmetic: an earlier
# where=[".."] form put the repo root itself on sys.path, so a product-only
# install could still `import demo`. Verified after the fix, from outside
# this checkout: `import warden` succeeds and `import demo` raises
# ModuleNotFoundError with only `warden` installed. --import-mode=importlib
# is added for Task 21's split test trees, which will have colliding
# basenames across warden/tests and demo/tests that the default (prepend)
# import mode cannot disambiguate.
addopts = --import-mode=importlib
markers =
    integration: requires the opa binary on PATH
