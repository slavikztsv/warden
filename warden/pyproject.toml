[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "0.1.0"
description = "A policy-enforcing broker for AI agent tool calls and network egress"
requires-python = ">=3.11"
# Deliberately minimal, and asserted so by tests/test_entry_points.py. The
# enforcement point has no business holding a model credential, and no
# business carrying the SDK that would use one.
#
# This list is the authoritative runtime set. A second file used to restate all
# four of these pins alongside pytest, which left two places declaring the same
# versions and nothing saying which won; it is now requirements-dev.txt and
# carries only what the runtime does not need.
#
# httpx stays on 0.28.x deliberately. Starlette's TestClient warns that it
# wants `httpx2`; that is a new major package, the broker uses httpx for real
# outbound traffic as well as in tests, and swapping both at once is a
# migration rather than a bump. The warning is a deprecation, not a break.
# Note that enabling the `mcp` extra below brings httpx2 into the process
# anyway, alongside this pin rather than in place of it -- they are separate
# distributions under separate top-level names and coexist.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.0",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.13.0",
]

# The MCP surface's dependencies, and only its. mcp pulls a second HTTP
# stack (httpx2, alongside the pinned httpx) plus opentelemetry-api into
# whatever process installs it, so a deployment that never enables the
# surface never carries them. The broker raises at boot if [mcp] is enabled
# and this extra is absent, rather than discovering it at the first request.
[project.optional-dependencies]
mcp = [
  "mcp==2.0.0",
]

[project.scripts]
warden = "warden.cli.main:main"

# Explicit, not packages.find: `where = [".."]` (needed pre-Task-20, when
# warden/ held only warden/cli/ and the rest of the "warden" package lived at
# the repo root as sibling broker/ and policies/ directories) makes
# setuptools add the REPO ROOT ITSELF to sys.path on an editable install --
# not just the warden package. Verified: with only `warden` installed
# editable, `import demo` succeeded from outside any project context, purely
# because the whole checkout was importable. `where = ["."]` looks tempting
# as the fix but is wrong for a different reason: relative to THIS file's
# directory (warden/), it would discover "broker" and "cli" as their OWN
# top-level packages (their __init__.py sits directly under the scanned
# root), not as "warden.broker" / "warden.cli".
#
# The fix is to say what the "warden" package's root directory IS (".", i.e.
# this directory) and enumerate its members explicitly. setuptools resolves
# each nested name's location by walking that one mapping plus the dotted
# path, e.g. warden.broker -> ./broker, warden.broker.adapters ->
# ./broker/adapters -- so every one of these must be listed, or a real
# subpackage silently fails to install. This produces a MAPPING-based
# editable finder (one entry per package, resolved at import time) rather
# than a repo-root .pth file, which is what stops the leak: importing
# anything outside this explicit list -- `demo`, `broker`, `cli` -- now
# raises ModuleNotFoundError even with this package installed editable.
[tool.setuptools]
packages = [
    "warden",
    "warden.broker",
    "warden.broker.adapters",
    "warden.broker.config",
    "warden.cli",
]

[tool.setuptools.package-dir]
warden = "."
